enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-allow-origin-all=false

continue=true
always-resume=true
max-resume-failure-tries=0
max-tries=5
retry-wait=10
connect-timeout=30
timeout=60

split=8
max-connection-per-server=8
min-split-size=5M
max-concurrent-downloads=1
auto-file-renaming=true
allow-overwrite=false
file-allocation=none
disk-cache=64M

save-session-interval=30
auto-save-interval=30
keep-unfinished-download-result=true
max-download-result=1000

on-download-complete=/usr/local/bin/aria2-event-complete
on-download-error=/usr/local/bin/aria2-event-error
on-download-stop=/usr/local/bin/aria2-event-removed

daemon=false
summary-interval=0
console-log-level=warn
